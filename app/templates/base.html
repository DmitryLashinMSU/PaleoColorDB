<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PaleoColor DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">PaleoColor DB</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="btn btn-warning btn-sm fw-bold mt-1" href="/admin">Редактировать</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container flex-grow-1">
        {% block content %}{% endblock %}
    </div>
    
    <footer class="text-center mt-auto py-4 border-top">
        <p class="text-muted small mb-0">&copy; Справочник по окраске докайнозойских ископаемых животных</p>
    </footer>

    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-transparent border-0">
          <div class="modal-body d-flex justify-content-center position-relative pt-4">
            <div class="position-relative d-inline-block">
                <button type="button" class="btn-close btn-close-white position-absolute" 
                        data-bs-dismiss="modal" aria-label="Закрыть"
                        style="top: 0; right: 0; transform: translate(calc(100% + 5px), calc(-100% - 5px)); z-index: 1055; opacity: 1;"></button>
                <img id="modalImage" src="" class="img-fluid rounded shadow" style="max-height: 85vh;">
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var imageModal = document.getElementById('imageModal');
        imageModal.addEventListener('show.bs.modal', function (event) {
          var triggerImg = event.relatedTarget;
          var src = triggerImg.getAttribute('src');
          document.getElementById('modalImage').setAttribute('src', src);
        });
      });
    </script>
</body>
</html>
